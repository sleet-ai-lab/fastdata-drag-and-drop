# ========================================
# fastdata-drag-and-drop — nginx config
#
# replaces the stock /etc/nginx/conf.d/default.conf. it serves the
# vite build as static files, with a SPA fallback so client-side
# routes still land on the app instead of a 404.
# ========================================

server {
    # listen on 80 inside the container. 0.0.0.0 (the default) is what
    # makes the container reachable from the other containers on the
    # compose network (cloudflared).
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # --- the built assets ---
    # vite emits content-hashed files into /assets, so they can be
    # cached forever. a new build produces new filenames, so a changed
    # file never serves stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the entry html must NEVER be cached: it points at the current
    # content-hashed asset names, and a cached copy would pin the
    # browser to an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # everything else (public/ files, favicon, etc.).
    location / {
        expires 1h;
        try_files $uri $uri/ /index.html;
    }

    # do not advertise the server version.
    server_tokens off;
}
# ========================================
